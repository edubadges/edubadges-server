site_name: Edubadges Server Documentation

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  icon:
    repo: fontawesome/brands/github

repo_url: https://github.com/edubadges/edubadges-server
repo_name: edubadges/edubadges-server
docs_dir: mkdocs
site_dir: docs

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - attr_list
  - md_in_html

plugins:
  - search
  - mermaid2

nav:
  - Home: index.md
  - Overview:
      - "Project Overview": "1. Project Overview.md"
      - "Architecture Overview": "2. Architecture Overview.md"
      - "Workflow Overview": "3. Workflow Overview.md"
  - Deep Dive:
      - "Badge Domain (issuer)": "4. Deep Dive/1. Badge Domain (issuer).md"
      - "User & Authentication": "4. Deep Dive/2. User Model & Authentication.md"
      - "Signing Infrastructure": "4. Deep Dive/3. Signing Infrastructure.md"
      - "Institutional Hierarchy & RBAC": "4. Deep Dive/4. Institutional Hierarchy & RBAC.md"
      - "LTI Integration": "4. Deep Dive/5. LTI Integration.md"
      - "Direct Award System": "4. Deep Dive/6. Direct Award System.md"
      - "Backpack & Public Verification": "4. Deep Dive/7. Backpack & Public Verification.md"
      - "Mobile API": "4. Deep Dive/8. Mobile API.md"
      - "OB3 & BadgeConnect": "4. Deep Dive/9. Open Badges 3 & BadgeConnect.md"
      - "Infrastructure": "4. Deep Dive/10. Infrastructure Components.md"
