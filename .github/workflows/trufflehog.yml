name: "Trufflehog"

on:
  push:
    branches: [develop]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [develop]

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    name: "trufflehog"
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: trufflesecurity/trufflehog@v3.84.2
