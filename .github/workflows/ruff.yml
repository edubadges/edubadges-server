name: Ruff
on:
  push:
    branches: [ "develop" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "develop" ]
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version-file: "requirements-dev.txt"
      - run: ruff format --check .
